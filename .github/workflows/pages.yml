name: Test and deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2.4.2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project assets
        run: godot --headless --path . --import

      - name: Run gameplay smoke test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/smoke_test.gd

      - name: Run fun systems regression test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/fun_systems_test.gd

      - name: Run playability regression test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/playability_test.gd

      - name: Run keyboard aiming regression test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/keyboard_aim_test.gd

      - name: Run top-down regression test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/top_down_test.gd

      - name: Check cat model integration and rendering budget
        timeout-minutes: 2
        run: godot --headless --path . --script tests/cat_model_test.gd

      - name: Check sprite completeness and framing
        run: godot --headless --path . --script tests/model_art_test.gd
        timeout-minutes: 2

      - name: Check reference fox model and ambusher integration
        timeout-minutes: 2
        run: godot --headless --path . --script tests/fox_model_test.gd

      - name: Run difficulty balance regression test
        timeout-minutes: 2
        run: godot --headless --path . --script tests/balance_test.gd

      - name: Check four-wing owl model and ranged attack integration
        timeout-minutes: 2
        run: godot --headless --path . --script tests/owl_model_test.gd

      - name: Check reference snake model and venom attack integration
        timeout-minutes: 2
        run: godot --headless --path . --script tests/snake_model_test.gd

      - name: Export web build
        run: godot --headless --path . --export-release Web build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
